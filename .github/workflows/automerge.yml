# Cualquier PR que abra tonchimatta contra main se mergea al tiro.
# (Sus pushes directos a main ya salen sin aprobación: tiene permiso de escritura.)
name: auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login == 'tonchimatta'
    runs-on: ubuntu-latest
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          gh pr merge "$PR" --repo "$REPO" --merge
          # el merge solo ya dispara el build de Pages; aquí solo se limpia la rama
          if [ "$SAME_REPO" = true ]; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || true
          fi
