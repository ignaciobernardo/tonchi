<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tonchimatta/projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Courier+Prime:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="projects.css">
</head>
<body>
  <button id="back" aria-label="Back to portfolio" title="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </button>

  <main class="contents">
    <h1>Contents</h1>
    <ul class="toc" id="toc"></ul>
  </main>
  <div class="keys">&uarr; &darr; select &nbsp;&middot;&nbsp; enter open</div>

  <script src="data.js"></script>
  <script>
    // Back arrow: this page opens in a new tab, so close it to return to the desktop.
    document.getElementById('back').addEventListener('click', function () {
      if (window.opener && !window.opener.closed) {
        try { window.opener.focus(); } catch (e) {}
        window.close();
        setTimeout(function () { location.href = '../#desktop'; }, 250);
      } else {
        location.href = '../#desktop';
      }
    });

    // Contents list: staggered indent like a printed table of contents.
    var ramp = [0, 1, 2, 3, 4, 5, 4, 3, 2, 1];
    var toc = document.getElementById('toc');
    var items = PROJECTS.map(function (p, i) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = 'project.html?p=' + p.slug;
      a.style.setProperty('--i', ramp[i % ramp.length]);
      a.innerHTML = '<span class="t"></span><span class="n"></span>';
      a.querySelector('.t').textContent = p.title;
      a.querySelector('.n').textContent = p.year;
      a.addEventListener('mouseenter', function () { select(i); });
      li.appendChild(a); toc.appendChild(li);
      return a;
    });

    var cur = Math.min(+sessionStorage.getItem('toc-sel') || 0, items.length - 1);
    function select(i) {
      cur = (i + items.length) % items.length;
      items.forEach(function (a, j) { a.classList.toggle('sel', j === cur); });
      sessionStorage.setItem('toc-sel', cur);
    }
    select(cur);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); select(cur + 1); }
      else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); select(cur - 1); }
      else if (e.key === 'Enter') { location.href = items[cur].href; }
    });
  </script>
</body>
</html>
