<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tonchimatta/projects</title>
<style>
  :root { --bg:#fbfbfc; --ink:#2f3140; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  #back { position: fixed; top: 22px; left: 22px; width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,.1); background: #fff; color: var(--ink); cursor: pointer;
    display: grid; place-items: center; box-shadow: 0 4px 14px rgba(30,32,50,.1);
    transition: transform .15s, box-shadow .15s; }
  #back:hover { transform: translateX(-2px); box-shadow: 0 6px 18px rgba(30,32,50,.16); }
  #back svg { width: 20px; height: 20px; }
</style>
</head>
<body>
  <button id="back" aria-label="Back to portfolio" title="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </button>

  <script>
    // This page opens in a new tab. The arrow closes it, which drops you back
    // on the tab you came from. If it was opened directly, go to the desktop instead.
    document.getElementById('back').addEventListener('click', function () {
      if (window.opener && !window.opener.closed) {
        try { window.opener.focus(); } catch (e) {}
        window.close();
        setTimeout(function () { location.href = '../#desktop'; }, 250);
      } else {
        location.href = '../#desktop';
      }
    });
  </script>
</body>
</html>
