<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tonchimatta/projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Courier+Prime:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="projects.css">
</head>
<body>
  <a id="back" href="./" aria-label="Back to contents" title="Contents">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </a>
  <main class="page" id="page"></main>

  <script src="data.js"></script>
  <script>
    var slug = new URLSearchParams(location.search).get('p');
    var idx = PROJECTS.findIndex(function (p) { return p.slug === slug; });
    if (idx < 0) idx = 0;
    var P = PROJECTS[idx], prev = PROJECTS[idx - 1], next = PROJECTS[idx + 1];
    sessionStorage.setItem('toc-sel', idx);
    document.title = P.title + ' — tonchimatta/projects';

    function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
    function paras(arr, parent) { arr.forEach(function (t) { parent.appendChild(el('p', null, t)); }); return parent; }
    function img(o, label) {
      if (o.src) { var i = el('img'); i.src = o.src; i.alt = o.alt || ''; return i; }
      return el('div', 'ph', label || 'IMAGE');
    }
    function link(p, label) {
      var a = el('a', p ? null : 'off', label);
      if (p) a.href = 'project.html?p=' + p.slug; return a;
    }

    var root = document.getElementById('page');

    // top bar
    var bar = el('header', 'bar');
    bar.appendChild(el('div', 'brand', 'Tonchi Matta'));
    var nav = el('nav');
    var contents = el('a', null, 'Contents'); contents.href = './';
    nav.appendChild(contents);
    nav.appendChild(el('span', null, (idx + 1 < 10 ? '0' : '') + (idx + 1) + ' / ' + (PROJECTS.length < 10 ? '0' : '') + PROJECTS.length));
    nav.appendChild(link(prev, '← Prev'));
    nav.appendChild(link(next, 'Next →'));
    bar.appendChild(nav); root.appendChild(bar);

    // title row
    var lead = el('div', 'lead');
    lead.appendChild(el('div', null, '↓ Scroll'));
    var t = el('div', null, P.title); lead.appendChild(t);
    root.appendChild(lead);

    // blocks, rendered in order
    P.blocks.forEach(function (b, n) {
      if (b.type === 'text') {
        var w = el('div', 'body' + (n === 0 ? ' first' : ''));
        root.appendChild(paras(b.paras, w));
      } else if (b.type === 'image') {
        var f = el('figure', 'block fig'); f.appendChild(img(b));
        if (b.caption) f.appendChild(el('figcaption', null, b.caption));
        root.appendChild(f);
      } else if (b.type === 'spread') {
        var s = el('section', 'spread'), top = el('div', 'top'), txt = el('div', 'txt');
        paras(b.text, txt); if (b.byline) txt.appendChild(el('p', 'by', b.byline));
        top.appendChild(txt);
        var pic = el('div', 'pic'); pic.appendChild(img(b.image || {}, 'IMAGE')); top.appendChild(pic);
        s.appendChild(top);
        var bot = el('div', 'bottom'), ttl = el('div', 'ttl');
        ttl.appendChild(el('h2', null, b.title || ''));
        var meta = el('div', 'meta'); (b.meta || []).forEach(function (m) { meta.appendChild(el('div', null, m)); });
        ttl.appendChild(meta);
        bot.appendChild(ttl);
        bot.appendChild(paras(b.text2 || [], el('div', 'col2')));
        s.appendChild(bot);
        root.appendChild(s);
      }
    });

    // pager
    var pg = el('nav', 'pager');
    pg.appendChild(prev ? link(prev, '← ' + prev.title) : el('span'));
    pg.appendChild(next ? link(next, next.title + ' →') : el('span'));
    root.appendChild(pg);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft' && prev) location.href = 'project.html?p=' + prev.slug;
      else if (e.key === 'ArrowRight' && next) location.href = 'project.html?p=' + next.slug;
      else if (e.key === 'Escape') location.href = './';
    });
  </script>
</body>
</html>
